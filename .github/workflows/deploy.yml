name: Deploy to GitHub Pages
on:
  push:
    branches:
      - "main" # или 'master', в зависимости от вашей ветки по умолчанию
  workflow_dispatch: # позволяет запускать вручную из вкладки Actions

permissions:
  contents: read
  pages: write
  id-token: write # необходимо для аутентификации

concurrency:
  group: "pages"
  cancel-in-progress: true # отменяет предыдущие запуски, если начался новый

jobs:
  deploy:
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist" # папка со собранным проектом

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
